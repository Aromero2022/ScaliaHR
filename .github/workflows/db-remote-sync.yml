name: "DB Remote Sync"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode"
        required: true
        type: choice
        options:
          - reset
          - repair-push
      confirm:
        description: "Type CONFIRM to proceed (destructive operation)"
        required: true
        type: string
      owner_email:
        description: "Optional: email of auth.users owner to link to demo tenant after sync"
        required: false
        type: string

concurrency:
  group: db-remote-sync
  cancel-in-progress: false

env:
  EXPECTED_MIGRATION_COUNT: "27"
  DEMO_TENANT_ID: "a0000000-0000-0000-0000-000000000001"
  RESET_PUBLIC_SQL: |
    DROP SCHEMA public CASCADE;
    CREATE SCHEMA public;
    GRANT USAGE  ON SCHEMA public TO postgres, anon, authenticated, service_role;
    GRANT CREATE ON SCHEMA public TO postgres, service_role;
    GRANT ALL    ON SCHEMA public TO postgres, service_role;
    ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
      GRANT ALL    ON TABLES    TO postgres, service_role;
    ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
      GRANT SELECT ON TABLES    TO anon, authenticated;
    ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
      GRANT ALL    ON FUNCTIONS TO postgres, service_role;
    ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
      GRANT EXECUTE ON FUNCTIONS TO anon, authenticated;
    ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
      GRANT ALL   ON SEQUENCES TO postgres, service_role;
    ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
      GRANT USAGE ON SEQUENCES TO anon, authenticated;

jobs:
  sync:
    name: "Sync remote DB (${{ inputs.mode }})"
    runs-on: ubuntu-latest
    environment: remote-db
    if: inputs.confirm == 'CONFIRM'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # ──────────────────────────────────────────────────────────
      # PHASE 1 — Backup remote state
      # ──────────────────────────────────────────────────────────

      - name: Backup current state
        run: |
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" > backup/pre-sync-schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only > backup/pre-sync-data.sql
        continue-on-error: true

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup/
          retention-days: 30

      # ──────────────────────────────────────────────────────────
      # PHASE 2 — Local rehearsal (same sequence, local DB)
      # ──────────────────────────────────────────────────────────

      - name: "Rehearsal: start local Supabase"
        run: |
          supabase start -x realtime,storage-api,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
          echo "LOCAL_DB_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres" >> "$GITHUB_ENV"

      - name: "Rehearsal: restore remote backup to local"
        run: |
          echo "Replacing local public schema with remote backup..."
          psql "$LOCAL_DB_URL" -c "DROP SCHEMA IF EXISTS public CASCADE;"
          psql "$LOCAL_DB_URL" <<< "$RESET_PUBLIC_SQL"
          if [ -s backup/pre-sync-schema.sql ]; then
            psql "$LOCAL_DB_URL" < backup/pre-sync-schema.sql
            echo "Restored remote schema dump to local DB."
          else
            echo "No schema backup to restore (empty file). Starting from clean public."
          fi
          psql "$LOCAL_DB_URL" -c "
            DELETE FROM supabase_migrations.schema_migrations;
            INSERT INTO supabase_migrations.schema_migrations (version)
            VALUES ('20261021000001'),('20261021000002'),('20261021000003'),
                   ('20261021000004'),('20261021000005');
          "
          echo "Inserted fake divergent migration history."

      - name: "Rehearsal: revoke migration history"
        run: |
          VERSIONS=$(supabase migration list --db-url "$LOCAL_DB_URL" 2>/dev/null \
            | grep -oP '^\s*\K\d{14}' || true)
          if [ -n "$VERSIONS" ]; then
            echo "Revoking $(echo "$VERSIONS" | wc -l) migration(s)..."
            for v in $VERSIONS; do
              supabase migration repair --status reverted --db-url "$LOCAL_DB_URL" "$v"
            done
          else
            echo "No migrations to revoke."
          fi

      - name: "Rehearsal: apply — reset"
        if: inputs.mode == 'reset'
        run: |
          psql "$LOCAL_DB_URL" <<< "$RESET_PUBLIC_SQL"
          supabase db push --db-url "$LOCAL_DB_URL" --include-all

      - name: "Rehearsal: apply — repair-push"
        if: inputs.mode == 'repair-push'
        run: supabase db push --db-url "$LOCAL_DB_URL" --include-all

      - name: "Rehearsal: verify"
        run: |
          echo "=== Migration count ==="
          APPLIED=$(supabase migration list --db-url "$LOCAL_DB_URL" 2>/dev/null \
            | grep -cP '^\s*\d{14}' || echo "0")
          echo "Applied: $APPLIED / Expected: $EXPECTED_MIGRATION_COUNT"
          if [ "$APPLIED" -ne "$EXPECTED_MIGRATION_COUNT" ]; then
            echo "::error::Rehearsal FAILED — expected $EXPECTED_MIGRATION_COUNT migrations, got $APPLIED"
            exit 1
          fi

          echo "=== Schema diff (should be empty) ==="
          DIFF="$(supabase db diff --db-url "$LOCAL_DB_URL" 2>&1)" || true
          echo "$DIFF"
          if [ -n "$DIFF" ] && echo "$DIFF" | grep -qE '^(CREATE|ALTER|DROP)'; then
            echo "::error::Rehearsal FAILED — schema drift detected"
            exit 1
          fi

          echo "=== Critical objects ==="
          psql "$LOCAL_DB_URL" -t -A -F'|' <<'SQL'
          SELECT 'custom_access_token_hook' AS object,
                 EXISTS(SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
                        WHERE n.nspname='public' AND p.proname='custom_access_token_hook') AS present,
                 EXISTS(SELECT 1 FROM information_schema.routine_privileges
                        WHERE routine_name='custom_access_token_hook'
                          AND grantee='supabase_auth_admin'
                          AND privilege_type='EXECUTE') AS granted
          UNION ALL
          SELECT 'requesting_tenant_id',
                 EXISTS(SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
                        WHERE n.nspname='public' AND p.proname='requesting_tenant_id'), NULL
          UNION ALL
          SELECT 'is_tenant_admin',
                 EXISTS(SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
                        WHERE n.nspname='public' AND p.proname='is_tenant_admin'), NULL
          UNION ALL
          SELECT 'insert_effective_record',
                 EXISTS(SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
                        WHERE n.nspname='public' AND p.proname='insert_effective_record'), NULL
          UNION ALL
          SELECT 'effective_record_at',
                 EXISTS(SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
                        WHERE n.nspname='public' AND p.proname='effective_record_at'), NULL
          UNION ALL
          SELECT 'anonymize_user',
                 EXISTS(SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
                        WHERE n.nspname='public' AND p.proname='anonymize_user'), NULL
          UNION ALL
          SELECT 'export_user_data',
                 EXISTS(SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
                        WHERE n.nspname='public' AND p.proname='export_user_data'), NULL
          UNION ALL
          SELECT 'check_rate_limit',
                 EXISTS(SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
                        WHERE n.nspname='public' AND p.proname='check_rate_limit'), NULL
          UNION ALL
          SELECT 'write_audit_log',
                 EXISTS(SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
                        WHERE n.nspname='public' AND p.proname='write_audit_log'), NULL
          UNION ALL
          SELECT 'get_direct_reports',
                 EXISTS(SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
                        WHERE n.nspname='public' AND p.proname='get_direct_reports'), NULL
          UNION ALL
          SELECT 'set_manager_assessment',
                 EXISTS(SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
                        WHERE n.nspname='public' AND p.proname='set_manager_assessment'), NULL
          UNION ALL
          SELECT 'upsert_self_assessment',
                 EXISTS(SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
                        WHERE n.nspname='public' AND p.proname='upsert_self_assessment'), NULL
          UNION ALL
          SELECT 'current_app_user_id',
                 EXISTS(SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
                        WHERE n.nspname='public' AND p.proname='current_app_user_id'), NULL
          UNION ALL
          SELECT 'has_app_role',
                 EXISTS(SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
                        WHERE n.nspname='public' AND p.proname='has_app_role'), NULL
          UNION ALL
          SELECT 'compute_arco_due_date',
                 EXISTS(SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
                        WHERE n.nspname='public' AND p.proname='compute_arco_due_date'), NULL
          UNION ALL
          SELECT 'btree_gist_extension',
                 EXISTS(SELECT 1 FROM pg_extension WHERE extname='btree_gist'), NULL;
          SQL

          echo ""
          echo "=== SECURITY DEFINER functions ==="
          psql "$LOCAL_DB_URL" -t -A <<'SQL'
          SELECT p.proname || ' — SECURITY DEFINER: ' || p.prosecdef
          FROM pg_proc p
          JOIN pg_namespace n ON p.pronamespace = n.oid
          WHERE n.nspname = 'public'
            AND p.proname IN (
              'custom_access_token_hook','is_tenant_admin',
              'insert_effective_record','effective_record_at',
              'anonymize_user','export_user_data',
              'check_rate_limit','purge_expired_rate_limits',
              'write_audit_log','set_manager_assessment',
              'upsert_self_assessment','get_direct_reports'
            )
          ORDER BY p.proname;
          SQL

          MISSING=$(psql "$LOCAL_DB_URL" -t -A <<'SQL'
          SELECT string_agg(fn, ', ')
          FROM unnest(ARRAY[
            'custom_access_token_hook','requesting_tenant_id','is_tenant_admin',
            'insert_effective_record','effective_record_at','anonymize_user',
            'export_user_data','check_rate_limit','write_audit_log',
            'get_direct_reports','set_manager_assessment','upsert_self_assessment',
            'current_app_user_id','has_app_role','compute_arco_due_date'
          ]) AS fn
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
            WHERE n.nspname='public' AND p.proname=fn
          );
          SQL
          )
          if [ -n "$MISSING" ] && [ "$MISSING" != "" ]; then
            echo "::error::Rehearsal FAILED — missing functions: $MISSING"
            exit 1
          fi

          echo ""
          echo "✓ Rehearsal passed — all $EXPECTED_MIGRATION_COUNT migrations applied, no drift, all critical objects present."

      - name: "Rehearsal: stop local Supabase"
        if: always()
        run: supabase stop --no-backup 2>/dev/null || true

      # ──────────────────────────────────────────────────────────
      # PHASE 3 — Apply to remote (same sequence as rehearsal)
      # ──────────────────────────────────────────────────────────

      - name: Revoke remote migration history
        run: |
          REMOTE_VERSIONS=$(supabase migration list --db-url "$SUPABASE_DB_URL" 2>/dev/null \
            | grep -oP '^\s*\K\d{14}' || true)
          if [ -n "$REMOTE_VERSIONS" ]; then
            echo "Revoking $(echo "$REMOTE_VERSIONS" | wc -l) remote migration(s)..."
            for v in $REMOTE_VERSIONS; do
              supabase migration repair --status reverted --db-url "$SUPABASE_DB_URL" "$v"
            done
          else
            echo "No remote migrations to revoke."
          fi

      - name: "Apply — reset (drop + recreate public schema)"
        if: inputs.mode == 'reset'
        run: |
          psql "$SUPABASE_DB_URL" <<< "$RESET_PUBLIC_SQL"
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all

      - name: "Apply — repair-push (incremental)"
        if: inputs.mode == 'repair-push'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all

      # ──────────────────────────────────────────────────────────
      # PHASE 4 — Verify remote
      # ──────────────────────────────────────────────────────────

      - name: "Verify: migration count"
        run: |
          supabase migration list --db-url "$SUPABASE_DB_URL"
          APPLIED=$(supabase migration list --db-url "$SUPABASE_DB_URL" 2>/dev/null \
            | grep -cP '^\s*\d{14}' || echo "0")
          echo "Applied: $APPLIED / Expected: $EXPECTED_MIGRATION_COUNT"
          if [ "$APPLIED" -ne "$EXPECTED_MIGRATION_COUNT" ]; then
            echo "::error::Expected $EXPECTED_MIGRATION_COUNT migrations, got $APPLIED"
            exit 1
          fi

      - name: "Verify: schema diff (should be empty)"
        run: |
          DIFF="$(supabase db diff --linked 2>&1)" || true
          echo "$DIFF"
          if [ -n "$DIFF" ] && echo "$DIFF" | grep -qE '^(CREATE|ALTER|DROP)'; then
            echo "::error::Schema drift detected after sync"
            exit 1
          fi

      - name: "Verify: critical objects"
        run: |
          echo "=== custom_access_token_hook + supabase_auth_admin grant ==="
          psql "$SUPABASE_DB_URL" -t -A <<'SQL'
          SELECT 'hook_exists: ' || EXISTS(
            SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
            WHERE n.nspname='public' AND p.proname='custom_access_token_hook'
          );
          SELECT 'auth_admin_grant: ' || EXISTS(
            SELECT 1 FROM information_schema.routine_privileges
            WHERE routine_name='custom_access_token_hook'
              AND grantee='supabase_auth_admin'
              AND privilege_type='EXECUTE'
          );
          SQL

          echo "=== SECURITY DEFINER functions ==="
          psql "$SUPABASE_DB_URL" -t -A <<'SQL'
          SELECT p.proname || ' — SECURITY DEFINER: ' || p.prosecdef
          FROM pg_proc p
          JOIN pg_namespace n ON p.pronamespace = n.oid
          WHERE n.nspname = 'public'
            AND p.proname IN (
              'custom_access_token_hook','is_tenant_admin',
              'insert_effective_record','effective_record_at',
              'anonymize_user','export_user_data',
              'check_rate_limit','purge_expired_rate_limits',
              'write_audit_log','set_manager_assessment',
              'upsert_self_assessment','get_direct_reports'
            )
          ORDER BY p.proname;
          SQL

          echo "=== btree_gist extension ==="
          psql "$SUPABASE_DB_URL" -t -A -c \
            "SELECT 'btree_gist: ' || EXISTS(SELECT 1 FROM pg_extension WHERE extname='btree_gist');"

          echo "=== All expected functions ==="
          MISSING=$(psql "$SUPABASE_DB_URL" -t -A <<'SQL'
          SELECT string_agg(fn, ', ')
          FROM unnest(ARRAY[
            'custom_access_token_hook','requesting_tenant_id','is_tenant_admin',
            'insert_effective_record','effective_record_at','anonymize_user',
            'export_user_data','check_rate_limit','write_audit_log',
            'get_direct_reports','set_manager_assessment','upsert_self_assessment',
            'current_app_user_id','has_app_role','compute_arco_due_date',
            'purge_expired_rate_limits'
          ]) AS fn
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
            WHERE n.nspname='public' AND p.proname=fn
          );
          SQL
          )
          if [ -n "$MISSING" ] && [ "$MISSING" != "" ]; then
            echo "::error::Missing functions after sync: $MISSING"
            exit 1
          fi
          echo "All critical objects verified."

      # ──────────────────────────────────────────────────────────
      # PHASE 5 — Link owner (optional)
      # ──────────────────────────────────────────────────────────

      - name: "Link owner to demo tenant"
        if: inputs.owner_email != ''
        run: |
          echo "Looking up auth.users for: ${{ inputs.owner_email }}"
          OWNER_ID=$(psql "$SUPABASE_DB_URL" -t -A -c \
            "SELECT id FROM auth.users WHERE email = '${{ inputs.owner_email }}' LIMIT 1;")
          if [ -z "$OWNER_ID" ]; then
            echo "::warning::No auth.users record found for ${{ inputs.owner_email }}. Skipping owner link."
            exit 0
          fi
          echo "Found auth user: $OWNER_ID"

          psql "$SUPABASE_DB_URL" <<SQL
          -- Ensure a public.users row exists for the owner
          INSERT INTO public.users (id, auth_uid, tenant_id, email, first_name, last_name, status)
          VALUES (
            gen_random_uuid(),
            '${OWNER_ID}',
            '${DEMO_TENANT_ID}',
            '${{ inputs.owner_email }}',
            'Owner',
            'Account',
            'ACTIVE'
          )
          ON CONFLICT (auth_uid) DO UPDATE SET
            tenant_id = '${DEMO_TENANT_ID}',
            status    = 'ACTIVE';

          -- Membership as owner
          INSERT INTO public.user_tenant_memberships (user_id, tenant_id, app_role, is_active)
          VALUES ('${OWNER_ID}', '${DEMO_TENANT_ID}', 'owner', true)
          ON CONFLICT (user_id, tenant_id) DO UPDATE SET
            app_role  = 'owner',
            is_active = true;

          -- Active tenant setting
          INSERT INTO public.user_settings (user_id, active_tenant_id)
          VALUES ('${OWNER_ID}', '${DEMO_TENANT_ID}')
          ON CONFLICT (user_id) DO UPDATE SET
            active_tenant_id = '${DEMO_TENANT_ID}';
          SQL

          echo "Owner linked: ${{ inputs.owner_email }} → tenant $DEMO_TENANT_ID as 'owner'"
