name: "DB Remote Sync"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode"
        required: true
        type: choice
        options:
          - reset
          - repair-push
      confirm:
        description: "Type CONFIRM to proceed (destructive operation)"
        required: true
        type: string
      owner_email:
        description: "Optional: email of auth.users owner to link to demo tenant after sync"
        required: false
        type: string
      load_seed:
        description: "Load supabase/seed.sql (demo tenant acme-corp) after the sync"
        required: false
        type: boolean
        default: false

concurrency:
  group: db-remote-sync
  cancel-in-progress: false

env:
  DEMO_TENANT_ID: "a0000000-0000-0000-0000-000000000001"

jobs:
  sync:
    name: "Sync remote DB (${{ inputs.mode }})"
    runs-on: ubuntu-24.04
    environment: remote-db
    if: inputs.confirm == 'CONFIRM'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: "Validate inputs"
        if: inputs.owner_email != '' && inputs.mode == 'reset' && !inputs.load_seed
        run: |
          echo "::error::owner_email requires load_seed when mode=reset. A reset wipes the database; without the seed there is no demo tenant to link the owner to."
          exit 1

      - name: "Reminder: access-token hook must be disabled"
        run: |
          MSG="Before this run: custom_access_token_hook must be DISABLED in the dashboard (Authentication -> Hooks). See docs/ARCHITECTURE.md (D9)."
          echo "::warning title=Auth hook::$MSG"
          echo "### Auth hook" >> "$GITHUB_STEP_SUMMARY"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # ──────────────────────────────────────────────────────────
      # PHASE 1 — Backup remote state
      # ──────────────────────────────────────────────────────────

      - name: Backup current state
        run: |
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" > backup/pre-sync-schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only > backup/pre-sync-data.sql
        continue-on-error: true

      - name: Upload backup
        uses: actions/upload-artifact@v5
        with:
          name: db-backup-${{ github.run_id }}
          path: backup/
          retention-days: 30

      # ──────────────────────────────────────────────────────────
      # PHASE 2 — Local rehearsal (same sequence, local DB)
      # ──────────────────────────────────────────────────────────

      - name: "Rehearsal: start local Supabase"
        run: |
          supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,studio
          echo "LOCAL_DB_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres" >> "$GITHUB_ENV"

      - name: "Rehearsal: restore remote backup to local"
        run: |
          echo "Replacing local public schema with remote backup..."
          psql "$LOCAL_DB_URL" <<'SQL'
          DROP SCHEMA IF EXISTS public CASCADE;
          CREATE SCHEMA public;
          GRANT ALL ON SCHEMA public TO postgres, anon, authenticated, service_role;
          SQL
          if [ -s backup/pre-sync-schema.sql ]; then
            psql "$LOCAL_DB_URL" < backup/pre-sync-schema.sql
            echo "Restored remote schema dump to local DB."
          else
            echo "No schema backup to restore (empty file). Starting from clean public."
          fi
          psql "$LOCAL_DB_URL" -c "
            DELETE FROM supabase_migrations.schema_migrations;
            INSERT INTO supabase_migrations.schema_migrations (version)
            VALUES ('20261021000001'),('20261021000002'),('20261021000003'),
                   ('20261021000004'),('20261021000005');
          "
          echo "Inserted fake divergent migration history."

      - name: "Rehearsal: sync (reset)"
        if: inputs.mode == 'reset'
        run: bash scripts/db-reset-sync.sh "$LOCAL_DB_URL"

      - name: "Rehearsal: revoke migration history (repair-push)"
        if: inputs.mode == 'repair-push'
        run: |
          VERSIONS=$(psql "$LOCAL_DB_URL" -t -A -c \
            "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;")
          if [ -n "$VERSIONS" ]; then
            COUNT=$(echo "$VERSIONS" | wc -l)
            echo "Revoking $COUNT migration(s) from local rehearsal DB..."
            for v in $VERSIONS; do
              supabase migration repair --status reverted --db-url "$LOCAL_DB_URL" "$v"
            done
          else
            echo "No migrations to revoke."
          fi

      - name: "Rehearsal: apply (repair-push)"
        if: inputs.mode == 'repair-push'
        run: supabase db push --db-url "$LOCAL_DB_URL" --include-all

      - name: "Rehearsal: verify (repair-push)"
        if: inputs.mode == 'repair-push'
        run: |
          echo "=== Migration count ==="
          EXPECTED=$(ls supabase/migrations/*.sql | wc -l)
          APPLIED=$(psql "$LOCAL_DB_URL" -t -A -c \
            "SELECT count(*) FROM supabase_migrations.schema_migrations;")
          echo "Applied: $APPLIED / Expected: $EXPECTED"
          if [ "$APPLIED" -ne "$EXPECTED" ]; then
            echo "::error::Rehearsal FAILED — expected $EXPECTED migrations, got $APPLIED"
            exit 1
          fi

          echo "=== Schema diff (should be empty) ==="
          bash scripts/check-schema-drift.sh --db-url "$LOCAL_DB_URL"

          echo "Rehearsal verify passed."

      - name: "Rehearsal: load seed"
        if: inputs.load_seed
        run: |
          # Twice, to prove the seed is idempotent before it reaches the remote.
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: "Rehearsal: demo tenant present for owner_email"
        if: inputs.owner_email != '' && (inputs.mode == 'reset' || inputs.load_seed)
        run: bash scripts/require-demo-tenant.sh "$LOCAL_DB_URL"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: "Rehearsal: install dependencies"
        run: npm ci

      - name: "Rehearsal: run integration tests"
        run: |
          bash scripts/run-integration-tests.sh
        env:
          NODE_ENV: test

      - name: "Rehearsal: stop local Supabase"
        if: always()
        run: supabase stop --no-backup 2>/dev/null || true

      # ──────────────────────────────────────────────────────────
      # PHASE 3 — Apply to remote
      # ──────────────────────────────────────────────────────────

      - name: "Remote: sync (reset)"
        if: inputs.mode == 'reset'
        run: bash scripts/db-reset-sync.sh "$SUPABASE_DB_URL"

      - name: "Remote: revoke migration history (repair-push)"
        if: inputs.mode == 'repair-push'
        run: |
          REMOTE_VERSIONS=$(psql "$SUPABASE_DB_URL" -t -A -c \
            "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;")
          if [ -n "$REMOTE_VERSIONS" ]; then
            COUNT=$(echo "$REMOTE_VERSIONS" | wc -l)
            echo "Revoking $COUNT remote migration(s)..."
            for v in $REMOTE_VERSIONS; do
              supabase migration repair --status reverted --db-url "$SUPABASE_DB_URL" "$v"
            done
          else
            echo "No remote migrations to revoke."
          fi

      - name: "Remote: apply (repair-push)"
        if: inputs.mode == 'repair-push'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all

      # ──────────────────────────────────────────────────────────
      # PHASE 4 — Verify remote (repair-push only; reset verified by script)
      # ──────────────────────────────────────────────────────────

      - name: "Verify: migration count"
        if: inputs.mode == 'repair-push'
        run: |
          EXPECTED=$(ls supabase/migrations/*.sql | wc -l)
          APPLIED=$(psql "$SUPABASE_DB_URL" -t -A -c \
            "SELECT count(*) FROM supabase_migrations.schema_migrations;")
          echo "Applied: $APPLIED / Expected: $EXPECTED"
          if [ "$APPLIED" -ne "$EXPECTED" ]; then
            echo "::error::Expected $EXPECTED migrations, got $APPLIED"
            exit 1
          fi

      - name: "Verify: schema diff"
        if: inputs.mode == 'repair-push'
        run: |
          bash scripts/check-schema-drift.sh --linked

      - name: "Verify: critical objects"
        if: inputs.mode == 'repair-push'
        run: |
          MISSING=$(psql "$SUPABASE_DB_URL" -t -A <<'SQL'
          SELECT string_agg(fn, ', ')
          FROM unnest(ARRAY[
            'custom_access_token_hook','requesting_tenant_id','is_tenant_admin',
            'insert_effective_record','effective_record_at','anonymize_user',
            'export_user_data','check_rate_limit','write_audit_log',
            'get_direct_reports','set_manager_assessment','upsert_self_assessment',
            'current_app_user_id','has_app_role','compute_arco_due_date',
            'purge_expired_rate_limits'
          ]) AS fn
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
            WHERE n.nspname='public' AND p.proname=fn
          );
          SQL
          )
          if [ -n "$MISSING" ] && [ "$MISSING" != "" ]; then
            echo "::error::Missing functions after sync: $MISSING"
            exit 1
          fi
          echo "All critical objects verified."

      - name: "Remote: load seed"
        if: inputs.load_seed
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: "Remote: set prisma_app password"
        if: env.PRISMA_APP_PASSWORD != ''
        env:
          PRISMA_APP_PASSWORD: ${{ secrets.PRISMA_APP_PASSWORD }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE prisma_app WITH PASSWORD '$(printf '%s' "$PRISMA_APP_PASSWORD" | sed "s/'/''/g")';"
          echo "prisma_app password set from PRISMA_APP_PASSWORD secret."

      # ──────────────────────────────────────────────────────────
      # PHASE 5 — Link owner (optional)
      # ──────────────────────────────────────────────────────────

      - name: "Link owner to demo tenant"
        if: inputs.owner_email != ''
        env:
          OWNER_EMAIL: ${{ inputs.owner_email }}
        run: bash scripts/link-owner.sh "$SUPABASE_DB_URL" "$OWNER_EMAIL"

      - name: "Reminder: access-token hook after the sync"
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            MSG="Sync finished green: re-enable custom_access_token_hook (Authentication -> Hooks -> Postgres -> public.custom_access_token_hook), then sign out and sign in again so new tokens carry tenant_id. See docs/ARCHITECTURE.md (D9)."
          else
            MSG="Sync did not finish green ($JOB_STATUS): keep custom_access_token_hook DISABLED until a run ends green. See docs/ARCHITECTURE.md (D9)."
          fi
          echo "::warning title=Auth hook::$MSG"
          echo "### Auth hook" >> "$GITHUB_STEP_SUMMARY"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
