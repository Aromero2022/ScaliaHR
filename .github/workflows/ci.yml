name: CI

on:
  push:
    branches: [main, fix/estabilizacion-e1]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint · Types · Tests · Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"

  db:
    name: Database migrations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Supabase
        run: supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,studio

      - name: Validate migrations (db reset)
        run: supabase db reset

      - name: Prisma drift check
        run: |
          cd apps/web
          npx prisma db pull
          if ! git diff --quiet prisma/schema.prisma; then
            echo "::error::Prisma schema has drifted from the database. Run 'npm run db:sync' locally and commit."
            git diff prisma/schema.prisma
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Run integration tests
        run: |
          bash scripts/run-integration-tests.sh
        env:
          NODE_ENV: test

      - name: GoTrue logs (on failure)
        if: failure()
        run: docker logs --tail 200 "$(docker ps -a --filter name=supabase_auth --format '{{.Names}}' | head -1)" 2>&1 || true

  db-reset-test:
    name: DB reset sync test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Supabase
        run: supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,studio

      - name: Insert fake divergent history
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -c "
            INSERT INTO supabase_migrations.schema_migrations (version)
            VALUES ('20261021000001'),('20261021000002'),('20261021000003');
          "
          echo "Inserted fake divergent migration history."

      - name: Run reset sync script
        run: bash scripts/db-reset-sync.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres"

      - name: Load seed (twice, idempotency)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/seed.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Run integration tests
        run: |
          bash scripts/run-integration-tests.sh
        env:
          NODE_ENV: test

      - name: GoTrue logs (on failure)
        if: failure()
        run: docker logs --tail 200 "$(docker ps -a --filter name=supabase_auth --format '{{.Names}}' | head -1)" 2>&1 || true
