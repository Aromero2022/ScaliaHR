name: CI

on:
  push:
    branches: [main, fix/estabilizacion-e1]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN (D33): every job only reads the repository.
# The caches use the runner's own token, not this one, so no job needs more.
permissions:
  contents: read

env:
  # One place for the Supabase CLI version and the services CI leaves out:
  # together they decide which images the cache holds (D26).
  SUPABASE_CLI_VERSION: 2.122.1
  SUPABASE_EXCLUDE: realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,studio

jobs:
  app:
    name: Lint · Types · Tests · Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Check forbidden strings
        run: npm run check:forbidden
        working-directory: .

      # D33: turbo prune runs the ARG TURBO_VERSION of the Dockerfiles (D17), not
      # the lockfile's turbo. From the repo root, where both files live.
      - name: Dockerfiles pin the lockfile's turbo (D17)
        run: node scripts/check-turbo-version.mjs
        working-directory: .

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Email package lint, typecheck, unit tests and build
        run: |
          npx eslint . --max-warnings=0
          npx tsc --noEmit
          npx vitest run
          npm run build
        working-directory: packages/email

      - name: Worker lint
        run: npx eslint . --max-warnings=0
        working-directory: apps/worker

      - name: Worker typecheck
        run: npx tsc --noEmit
        working-directory: apps/worker

      - name: Worker unit tests
        run: npx vitest run
        working-directory: apps/worker

      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"

      - name: No debug or test routes, no browser source maps (D29, D32)
        run: node scripts/check-prod-build.mjs apps/web/.next
        working-directory: .

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history: a secret removed later is still leaked
          # gitleaks mounts the checkout, .git/config included: keep the token out of it.
          persist-credentials: false

      # gitleaks (MIT), pinned by digest; .gitleaks.toml adds only the public
      # demo keys of Supabase local to its default rules (D33).
      - name: gitleaks over the full git history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --config .gitleaks.toml --exit-code 1 .

  db:
    name: Database migrations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Supabase images from the cache
        id: supabase-images
        uses: ./.github/actions/supabase-images
        with:
          mode: restore
          cli-version: ${{ env.SUPABASE_CLI_VERSION }}
          services-excluded: ${{ env.SUPABASE_EXCLUDE }}

      - name: Start Supabase
        run: supabase start -x "$SUPABASE_EXCLUDE"

      - name: Validate migrations (db reset)
        run: supabase db reset

      - name: Prisma drift check
        run: |
          cd apps/web
          npx prisma db pull
          if ! git diff --quiet prisma/schema.prisma; then
            echo "::error::Prisma schema has drifted from the database. Run 'npm run db:sync' locally and commit."
            git diff prisma/schema.prisma
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Run integration tests
        run: |
          bash scripts/run-integration-tests.sh
        env:
          NODE_ENV: test

      - name: Run worker integration tests
        run: |
          npm run build -w @scaliahr/email
          source scripts/supabase-test-env.sh
          npm -w @scaliahr/worker run test:integration

      - name: GoTrue logs (on failure)
        if: failure()
        run: docker logs --tail 200 "$(docker ps -a --filter name=supabase_auth --format '{{.Names}}' | head -1)" 2>&1 || true

      - name: Cache Supabase images
        if: always()
        uses: ./.github/actions/supabase-images
        with:
          mode: save
          cli-version: ${{ env.SUPABASE_CLI_VERSION }}
          services-excluded: ${{ env.SUPABASE_EXCLUDE }}
          cache-hit: ${{ steps.supabase-images.outputs.cache-hit }}

  db-reset-test:
    name: DB reset sync test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Supabase images from the cache
        id: supabase-images
        uses: ./.github/actions/supabase-images
        with:
          mode: restore
          cli-version: ${{ env.SUPABASE_CLI_VERSION }}
          services-excluded: ${{ env.SUPABASE_EXCLUDE }}

      - name: Start Supabase
        run: supabase start -x "$SUPABASE_EXCLUDE"

      - name: Insert fake divergent history
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -c "
            INSERT INTO supabase_migrations.schema_migrations (version)
            VALUES ('20261021000001'),('20261021000002'),('20261021000003');
          "
          echo "Inserted fake divergent migration history."

      - name: Run reset sync script
        run: bash scripts/db-reset-sync.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres" local

      - name: Create demo auth user for seed coverage
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id, instance_id, aud, role, email, encrypted_password,
                                  email_confirmed_at, created_at, updated_at,
                                  raw_app_meta_data, raw_user_meta_data, confirmation_token)
          VALUES ('f0000000-0000-0000-0000-000000000001',
                  '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated',
                  'elena.demo@acme-corp.test',
                  crypt('DemoPass123!', gen_salt('bf')),
                  now(), now(), now(),
                  '{"provider":"email","providers":["email"]}'::jsonb,
                  '{}'::jsonb, '')
          ON CONFLICT (id) DO NOTHING;
          SQL

      - name: Load seed (twice, idempotency)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/seed.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Run integration tests
        run: |
          bash scripts/run-integration-tests.sh
        env:
          NODE_ENV: test

      - name: GoTrue logs (on failure)
        if: failure()
        run: docker logs --tail 200 "$(docker ps -a --filter name=supabase_auth --format '{{.Names}}' | head -1)" 2>&1 || true

      - name: Cache Supabase images
        if: always()
        uses: ./.github/actions/supabase-images
        with:
          mode: save
          cli-version: ${{ env.SUPABASE_CLI_VERSION }}
          services-excluded: ${{ env.SUPABASE_EXCLUDE }}
          cache-hit: ${{ steps.supabase-images.outputs.cache-hit }}

  docker:
    name: Docker images (build only)
    runs-on: ubuntu-24.04
    # Builds both images and runs them against Supabase local. Nothing is pushed:
    # there is no registry login and no push step (publishing is Phase 23).
    # D56: the job took 11–19 min before main's stack and its two k6 passes
    # (about +9 min); a job that hangs fails here instead of running for 6 h.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the pull request's merge commit and both parents (D36)

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # D36: on a pull request, HEAD is GitHub's merge commit: HEAD^1 is main and
      # HEAD^2 the pull request. If the diff only touches **/*.md, docs/** or
      # .claude/**, the images are main's and k6 is not compared with main's
      # median. A failure here fails the job: it never falls back to either answer.
      - name: Does the diff change the images? (D36)
        id: scope
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Empty when HEAD has no second parent (not a merge, or a depth-1 clone).
          parent="$(git rev-parse --verify --quiet HEAD^2 || true)"
          if [ -z "$PR_HEAD" ] || [ "$parent" != "$PR_HEAD" ]; then
            echo "::error::HEAD is not the merge commit of this pull request (HEAD^2: ${parent:-none}, pull request head: ${PR_HEAD:-none})"
            exit 1
          fi
          # To a file first: a failing git diff stops the step before anything is
          # classified, so it never reads as an empty diff.
          files="$(mktemp)"
          git diff -z --name-only --no-renames HEAD^1 HEAD > "$files"
          node scripts/k6-comparison-scope.mjs < "$files"

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Supabase images from the cache
        id: supabase-images
        uses: ./.github/actions/supabase-images
        with:
          mode: restore
          cli-version: ${{ env.SUPABASE_CLI_VERSION }}
          services-excluded: ${{ env.SUPABASE_EXCLUDE }}

      # D56: the k6 gate compares the PR with main on this same runner, in four
      # passes: main, PR, PR, main. Main's stack comes from a worktree of HEAD^1
      # (main on a pull request, the previous commit on a push), with main's own
      # files; only the k6 harness and the load settings are the PR's.
      - name: Main's tree at HEAD^1 (D56)
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/d56-ab.sh tree

      # D56: main's first pass, on a fresh stack, then its data deleted so the
      # PR's stack below starts as it did before D56. Skipped only when the scope
      # step said the diff cannot change the images; the ratio step then checks
      # that claim against the images.
      - name: Main's first k6 pass (D56 main-1)
        if: steps.scope.outputs.applies != 'false'
        run: |
          bash scripts/d56-ab.sh main-up build
          bash scripts/d56-ab.sh k6 main-1
          bash scripts/d56-ab.sh down
        env:
          LOAD_BIG_USERS: "60"
          LOAD_SMALL_USERS: "5"
          LOAD_VUS: "60"
          SMALL_VUS: "5"
          RAMP: "20s"
          HOLD: "40s"
          THINK_MIN: "2"
          THINK_MAX: "6"

      - name: Build images and start the local stack (npm run local:up)
        run: npm run local:up

      # D54: when the web container turned healthy, for the D36 diagnostics.
      # Read now: Docker keeps only the last five probes in State.Health.Log
      # (50 s at the image's 10 s interval), and the e2e runs before k6.
      # Diagnostics never fail the job: a failure shows as an ::error:: annotation.
      - name: First healthy probe of the web container (D54)
        continue-on-error: true
        run: node scripts/d36-diag.mjs healthy-at scaliahr-web-1

      - name: Images run as non-root and carry no secrets
        run: |
          for image in scaliahr-web:local scaliahr-worker:local; do
            user="$(docker image inspect -f '{{.Config.User}}' "$image")"
            if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
              echo "::error::$image runs as root"
              exit 1
            fi
            if docker image inspect -f '{{json .Config.Env}}' "$image" | grep -E -i 'DATABASE_URL|SERVICE_ROLE|JWT_SECRET|PASSWORD|ANON_KEY'; then
              echo "::error::$image bakes a secret into its environment"
              exit 1
            fi
            if docker run --rm --entrypoint sh "$image" -c 'find / -xdev -name ".env*" 2>/dev/null' | grep -q .; then
              echo "::error::$image contains a .env file"
              exit 1
            fi
            echo "$image: user=$user, no secrets in env, no .env files"
          done

      - name: Pages carry a nonce-based CSP on every script (D29)
        run: node scripts/check-csp.mjs http://localhost:3000/login

      # D41: the image sets no SCALIA_DEMO_LOGIN_HINT, so /login shows no demo credentials.
      - name: Login shows no demo credentials (D41)
        run: |
          page="$(curl -fsS http://localhost:3000/login)"
          if printf '%s' "$page" | grep -qE 'data-demo-login-hint|Demo1234|elena\.martinez@acme\.dev'; then
            echo "::error::/login shows demo credentials"
            exit 1
          fi
          echo "/login shows no demo credentials."

      # D44: the e2e suite with axe against the production image just started,
      # with accounts created and deleted by scripts/e2e.sh. Retries are 0: a
      # failure is rerun at most once, by rerunning the job.
      - name: Playwright browser for the e2e (D44)
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: e2e with axe, zoom and screenshots (D44)
        run: npm run e2e

      # Only after scripts/e2e.sh found no secret in them (the marker file); a
      # cancelled or unscanned run uploads nothing.
      - name: e2e artifacts (HTML report, axe report, screenshots)
        if: always() && hashFiles('apps/web/e2e-artifacts/escaneo-de-secretos.txt') != ''
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: apps/web/e2e-artifacts
          retention-days: 14

      # As root, so find can read every folder: as the image's own user it exits 1
      # on folders it may not read, even when it finds nothing.
      - name: No e2e tooling in the web image (D44)
        run: |
          found="$(docker run --rm --user 0 --entrypoint sh scaliahr-web:local -c 'find / -xdev -type d \( -name axe-core -o -name @axe-core -o -name playwright -o -name playwright-core -o -name @playwright \) -path "*node_modules*"')"
          if [ -n "$found" ]; then
            echo "::error::e2e tooling in scaliahr-web:local:"
            echo "$found"
            exit 1
          fi
          echo "scaliahr-web:local carries no axe or Playwright package."

      # D36: a short run of the load test, so the tooling keeps working and a
      # large regression shows up. The full 1,000-user run is local (RUNBOOK).
      # D54: k6 also writes every sample to requests-first.csv.gz (the artifact
      # below), to recompute the p95 with other windows without new runs.
      - name: k6 load test, short run (D36)
        id: d36_first
        run: npm run load:test -- --out "csv=fileName=/out/requests-first.csv.gz,timeFormat=unix_milli"
        env:
          LOAD_BIG_USERS: "60"
          LOAD_SMALL_USERS: "5"
          LOAD_VUS: "60"
          SMALL_VUS: "5"
          RAMP: "20s"
          HOLD: "40s"
          # Short pauses, so 75 users send real traffic (about 18 pages/s at full load).
          THINK_MIN: "2"
          THINK_MAX: "6"

      # D54: diagnostics of why a first attempt tends to be slower than its
      # rerun, one "D36-diag:" line each, in the log and in the job summary.
      # None of them touches the number D36 compares: the
      # `{ kind:page,phase:steady }` line of the step above. They also run when
      # that step failed, as long as it left its summary, and they never fail
      # the job: each command runs even if another failed, and a failure shows
      # as an ::error:: annotation.
      - name: D36 diagnostics of the first pass (D54)
        if: ${{ !cancelled() && hashFiles('load/.out/summary.json') != '' }}
        continue-on-error: true
        run: |
          status=0
          node scripts/d36-diag.mjs runner || status=1
          node scripts/d36-diag.mjs healthy-gap load/.out/requests-first.csv.gz || status=1
          node scripts/d36-diag.mjs sign-ins load/.out/summary.json first || status=1
          node scripts/d36-diag.mjs requests load/.out/requests-first.csv.gz first load/.out/summary.json || status=1
          # The image the measured container runs, offline, read-only and without privileges.
          if image="$(docker inspect -f '{{.Image}}' scaliahr-web-1)" &&
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
              --entrypoint node -v "$PWD/scripts/d36-standalone-files.mjs:/d36/standalone-files.mjs:ro" \
              "$image" /d36/standalone-files.mjs /app > load/.out/standalone-files.txt; then
            node scripts/d36-diag.mjs standalone load/.out/standalone-files.txt || status=1
          else
            echo "::error::D36-diag: could not list the web image's standalone files"
            rm -f load/.out/standalone-files.txt # never upload a partial list
            status=1
          fi
          exit "$status"

      # D54: the same k6 run again, on the same runner and stack, to test the
      # cold-start hypothesis. Informational only: never part of D36, neither its
      # baseline nor its limit. Its k6 summary goes to second-pass.txt in the
      # artifact, not to this log, so the job's only `{ kind:page,phase:steady }`
      # line is the first pass's. A crossed threshold (k6 exit 99) is reported;
      # any other exit, or a page that showed another tenant's employees, fails
      # the step with an ::error:: annotation. Each command runs even if another
      # failed. The step never fails the job: the isolation count does, in the
      # step "Tenant isolation held in the second k6 pass (D54)".
      - name: Second k6 pass, informational, not part of D36 (D54)
        id: second_pass
        if: ${{ !cancelled() && hashFiles('load/.out/summary.json') != '' }}
        continue-on-error: true
        run: |
          start="$(date +%s)"
          code=0
          LOAD_SUMMARY=summary-second.json npm run load:test -- --out "csv=fileName=/out/requests-second.csv.gz,timeFormat=unix_milli" > load/.out/second-pass.txt 2>&1 || code=$?
          printf '%s\n' "$code" > load/.out/k6-exit-second.txt # D56: this pass is also pr-2 of the A/B ratio
          status=0
          node scripts/d36-diag.mjs second-pass load/.out/summary-second.json "$code" "$(( $(date +%s) - start ))" load/.out/second-pass.txt || status=1
          node scripts/d36-diag.mjs sign-ins load/.out/summary-second.json second || status=1
          node scripts/d36-diag.mjs requests load/.out/requests-second.csv.gz second load/.out/summary-second.json || status=1
          exit "$status"
        env:
          LOAD_BIG_USERS: "60"
          LOAD_SMALL_USERS: "5"
          LOAD_VUS: "60"
          SMALL_VUS: "5"
          RAMP: "20s"
          HOLD: "40s"
          THINK_MIN: "2"
          THINK_MAX: "6"

      # D54: an explicit list, never the whole load/.out: accounts.json there
      # holds the load accounts' emails and their shared password. load/.out is
      # a hidden folder, which upload-artifact skips unless told otherwise.
      # Like the other diagnostics, a failed upload never fails the job.
      - name: D36 diagnostics artifact (D54)
        if: always() && hashFiles('load/.out/requests-first.csv.gz') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: d36-diag-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            load/.out/summary.json
            load/.out/summary-second.json
            load/.out/requests-first.csv.gz
            load/.out/requests-second.csv.gz
            load/.out/second-pass.txt
            load/.out/standalone-files.txt
          retention-days: 14

      # D54: the one result of the second pass that fails the job. A page that
      # showed another tenant's employees is a tenant-isolation failure, not a
      # diagnostic: the second pass's summary counts them, whatever k6's exit
      # code. If the second pass left no readable count, this step warns. The
      # first pass has its own isolation threshold (rate==1, load/pages.js),
      # which fails the D36 step on a single such page, but it is another run:
      # it does not cover the second. D56: the ratio step needs the count of all
      # four passes and fails the job when one is missing.
      - name: Tenant isolation held in the second k6 pass (D54)
        if: ${{ !cancelled() && steps.second_pass.outcome != '' && steps.second_pass.outcome != 'skipped' }}
        env:
          FAILED: ${{ steps.second_pass.outputs.tenant_isolation_failed }}
        run: |
          if [ -z "$FAILED" ]; then
            echo "::warning::D36-diag: the second k6 pass left no tenant-isolation count (see its step), so this step cannot check it; the D56 ratio step fails the job without it"
          elif [ "$FAILED" != "0" ]; then
            echo "::error::D36-diag: $FAILED page(s) of the second k6 pass showed another tenant's employees"
            exit 1
          else
            echo "No page of the second k6 pass showed another tenant's employees."
          fi

      # D56: the PR's two passes, recorded while their containers still run (the
      # export and the rollback drill come next): the D36 step's pass is pr-1, the
      # D54 second pass is pr-2. Each is checked here, so a broken one fails the
      # job before main's second pass is spent. The listing of the PR's images
      # serves the docs-only rule: a changed file that is in an image counts.
      - name: The PR's k6 passes for D56 (pr-1, pr-2)
        env:
          LOAD_BIG_USERS: "60"
          LOAD_SMALL_USERS: "5"
          LOAD_VUS: "60"
          SMALL_VUS: "5"
          RAMP: "20s"
          HOLD: "40s"
          THINK_MIN: "2"
          THINK_MAX: "6"
          PR_FIRST_OUTCOME: ${{ steps.d36_first.outcome }}
        run: |
          case "$PR_FIRST_OUTCOME" in success) first=0 ;; *) first="d36-step-${PR_FIRST_OUTCOME:-unknown}" ;; esac
          node scripts/d56-ab.mjs record pr-1 "$first"
          node scripts/d56-ab.mjs record pr-2 "$(cat load/.out/k6-exit-second.txt)"
          node scripts/d56-ab.mjs images pr

      - name: Per-tenant export through the running worker (D23)
        run: |
          docker exec scaliahr-worker-1 node dist/export-tenant.js a0000000-0000-0000-0000-000000000001
          docker exec scaliahr-worker-1 sh -c 'ls -l /backups/tenants/a0000000-0000-0000-0000-000000000001/*.export.gz'

      - name: Rollback drill (D24)
        run: |
          # A second local:up keeps the first images as :previous; rollback restarts them.
          npm run local:up
          npm run local:rollback
          for image in scaliahr-web scaliahr-worker; do
            running="$(docker inspect -f '{{.Image}}' "${image}-1")"
            previous="$(docker image inspect -f '{{.Id}}' "${image}:previous")"
            [ "$running" = "$previous" ] || { echo "::error::${image} is not running the :previous image"; exit 1; }
          done

      # D56: main's second pass, after the PR's stack is stopped and its data
      # deleted: main's images (:base, not rebuilt) on a fresh stack again. Then
      # main's images are listed too, for the docs-only rule on a push.
      - name: Main's second k6 pass (D56 main-2)
        if: steps.scope.outputs.applies != 'false'
        run: |
          bash scripts/d56-ab.sh down
          bash scripts/d56-ab.sh main-up reuse
          bash scripts/d56-ab.sh k6 main-2
          node scripts/d56-ab.mjs images main
        env:
          LOAD_BIG_USERS: "60"
          LOAD_SMALL_USERS: "5"
          LOAD_VUS: "60"
          SMALL_VUS: "5"
          RAMP: "20s"
          HOLD: "40s"
          THINK_MIN: "2"
          THINK_MAX: "6"

      # D56: the gate. r = exp(mean ln p95 of the PR's passes − mean ln p95 of
      # main's), from the four passes' own files. On a pull request r above 1.20
      # fails the job, and blocks when the one re-run of the job is above too; a
      # third attempt never passes. On a push r above 1.20 fails the job once, as
      # a regression already merged. It runs unconditionally, with no
      # continue-on-error: when it cannot compute or check r, the job fails.
      - name: D56 A/B ratio of the four k6 passes
        env:
          SCOPE_APPLIES: ${{ steps.scope.outputs.applies }}
        run: node scripts/d56-ab.mjs ratio

      # D56: an explicit list, never the whole load/.out (accounts.json there
      # holds the load accounts' emails and their shared password). A failed
      # upload never fails the job.
      - name: D56 artifact
        if: always() && hashFiles('load/.out/d56-tree.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: d56-ab-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            load/.out/d56-tree.json
            load/.out/d56-diff.bin
            load/.out/d56-pass-main-1.json
            load/.out/d56-pass-pr-1.json
            load/.out/d56-pass-pr-2.json
            load/.out/d56-pass-main-2.json
            load/.out/d56-images-pr.json
            load/.out/d56-images-main.json
            load/.out/d56-ratio.json
            load/.out/summary-main-1.json
            load/.out/summary-main-2.json
            load/.out/requests-main-1.csv.gz
            load/.out/requests-main-2.csv.gz
            load/.out/k6-main-1.txt
            load/.out/k6-main-2.txt
            load/.out/k6-exit-second.txt
          retention-days: 14

      - name: Container logs (on failure)
        if: failure()
        run: SUPABASE_NETWORK=unused MAILPIT_HOST=unused docker compose --env-file .env.docker logs --no-color --tail 200 web worker || true

      - name: Cache Supabase images
        if: always()
        uses: ./.github/actions/supabase-images
        with:
          mode: save
          cli-version: ${{ env.SUPABASE_CLI_VERSION }}
          services-excluded: ${{ env.SUPABASE_EXCLUDE }}
          cache-hit: ${{ steps.supabase-images.outputs.cache-hit }}

      - name: Stop the local stack
        if: always()
        run: npm run local:down -- --all
