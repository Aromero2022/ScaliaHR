# Local stack (Phase 9a, D17): web + worker on top of `supabase start`.
#   npm run local:up     start Supabase local, build and start both containers
#   npm run local:down   stop the containers (add -- --all to stop Supabase too)
# Supabase itself comes from the Supabase CLI. These containers join the CLI's
# Docker network, where its database and API gateway answer as `db` and `kong`.

name: scaliahr

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set it in .env.docker}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set it in .env.docker}
      labels:
        org.opencontainers.image.revision: ${GIT_REVISION:-unknown}
    image: scaliahr-web:local
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_INTERNAL_URL: http://kong:8000
      # D37: an explicit pool (Prisma's default is 2 × CPUs + 1) and a wait limit;
      # local Postgres allows 100 connections.
      DATABASE_URL: postgresql://prisma_app:${PRISMA_APP_PASSWORD:?set it in .env.docker}@db:5432/postgres?connection_limit=20&pool_timeout=10
      DIRECT_URL: postgresql://prisma_app:${PRISMA_APP_PASSWORD}@db:5432/postgres
      # Fixed superuser password of Supabase local; admin-client needs it (D3).
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      # lib/email enqueues as email_enqueuer, which can only add email.send jobs (D20).
      EMAIL_ENQUEUE_DATABASE_URL: postgresql://email_enqueuer:${EMAIL_ENQUEUER_PASSWORD:?set it in .env.docker}@db:5432/postgres
      # Tenant subdomains are <slug>.localhost (D21).
      APP_BASE_URL: http://localhost:${WEB_PORT:-3000}
      # D41: demo credentials shown on /login; empty (off) unless .env.docker sets
      # it, and ignored by a production server whose APP_BASE_URL is not local.
      SCALIA_DEMO_LOGIN_HINT: ${SCALIA_DEMO_LOGIN_HINT:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - supabase
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
      labels:
        org.opencontainers.image.revision: ${GIT_REVISION:-unknown}
    image: scaliahr-worker:local
    environment:
      WORKER_DATABASE_URL: postgresql://worker_app:${WORKER_APP_PASSWORD:?set it in .env.docker}@db:5432/postgres
      # SMTP adapter (D20): Mailpit of Supabase local, reached by container name.
      SMTP_HOST: ${MAILPIT_HOST:?run npm run local:up, which finds the Mailpit container}
      SMTP_PORT: "1025"
      EMAIL_FROM: no-reply@scaliahr.localhost
      APP_BASE_URL: http://localhost:${WEB_PORT:-3000}
      # Per-tenant exports (D23); copy them out with docker cp (docs/RUNBOOK.md).
      BACKUP_DIR: /backups
    volumes:
      - backups:/backups
    networks:
      - supabase
    restart: unless-stopped
    # Matches the 30 s graceful stop in apps/worker/src/index.ts.
    stop_grace_period: 35s

volumes:
  backups:

networks:
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:?run npm run local:up, which starts Supabase and sets SUPABASE_NETWORK}
