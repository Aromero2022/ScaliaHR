[project]
id = "jmquwwksfcqswsrkamer"
name = "ScaliaHR"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
jwt_expiry = 900

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[auth.sessions]
timebox = "24h"
inactivity_timeout = "1h"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Mailpit receives every email locally (D20). smtp_port exposes its SMTP server
# on the host for the worker integration tests; the containers use port 1025 on
# the Supabase network.
[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
